<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="description" content="SreeLakshmi Trust — Add Donation">
  <title>New Donation — SreeLakshmi Trust</title>
  <link rel="stylesheet" href="css/main.css">
  <meta name="theme-color" content="#1B2F6B">
  <style>
    body { background: var(--bg); }
    .form-wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
    .pay-method-row { display: flex; gap: 10px; }
    .pay-method-btn {
      flex: 1; padding: 12px 8px; border: 2px solid var(--border);
      border-radius: var(--r-md); background: white; font-size: var(--text-sm);
      font-weight: 700; cursor: pointer; transition: var(--t); text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-height: 70px; justify-content: center;
    }
    .pay-method-btn.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
    .pay-method-btn .pm-icon { font-size: 1.6rem; }
    .interest-row { display: flex; gap: 8px; }
    .interest-btn {
      flex: 1; padding: 10px 6px; border: 2px solid var(--border);
      border-radius: var(--r-full); background: white; font-size: var(--text-xs);
      font-weight: 700; cursor: pointer; transition: var(--t); text-align: center;
    }
    .interest-btn.low.active  { background: #27AE60; border-color: #27AE60; color: white; }
    .interest-btn.medium.active { background: #F39C12; border-color: #F39C12; color: white; }
    .interest-btn.high.active  { background: #E74C3C; border-color: #E74C3C; color: white; }
    .form-section { background: white; border-radius: var(--r-lg); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .form-section-title { font-size: var(--text-xs); font-weight: 800; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }
    .amount-input-wrap { position: relative; }
    .amount-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: var(--text-lg); font-weight: 700; color: var(--primary); pointer-events: none; }
    .amount-input-wrap input { padding-left: 32px; font-size: var(--text-xl); font-weight: 800; }
  </style>
</head>
<body>

<!-- Language Toggle -->
<div class="lang-toggle">
  <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
  <button class="lang-btn" data-lang="ml" onclick="setLanguage('ml')">മ</button>
</div>

<div id="toastContainer"></div>
<div id="loadingOverlay"><div class="spinner"></div><p>Loading...</p></div>

<!-- MAIN FORM -->
<div class="form-wrap" id="formWrap">

  <!-- Logo bar -->
  <div style="background:var(--primary-dark);padding:10px 16px;display:flex;align-items:center;gap:10px">
    <div style="background:white; padding:4px 8px; border-radius:6px; display:inline-flex; align-items:center; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
      <img src="logo.png" alt="SreeLakshmi Trust" style="height:28px;width:auto;display:block;">
    </div>
    <span style="color:white;font-weight:700;font-size:0.9375rem;">New Donation</span>
    <a href="index.html" style="margin-left:auto;color:rgba(255,255,255,0.7);font-size:1.3rem;line-height:1">←</a>
  </div>

  <div style="padding:16px;flex:1;overflow-y:auto;">

    <!-- Voucher ID -->
    <div class="form-section">
      <div class="form-section-title">🎫 Voucher Information</div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Voucher ID <span class="required">*</span></label>
        <input id="donVoucher" type="text" class="form-input" placeholder="Enter Voucher ID" autocomplete="off" style="text-transform:uppercase;font-weight:700;">
      </div>
    </div>

    <!-- Donor Info -->
    <div class="form-section">
      <div class="form-section-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>👤 Donor Information</span>
        <label style="display:flex;align-items:center;gap:6px;font-size:0.75rem;font-weight:700;color:var(--ad-muted);cursor:pointer;text-transform:none;letter-spacing:normal">
          <input type="checkbox" id="donUnknown" onchange="toggleUnknownDonor()"> Unknown Donor
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Full Name <span class="required">*</span></label>
        <input id="donName" type="text" class="form-input" placeholder="Enter donor's full name" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number <span class="required">*</span></label>
        <input id="donPhone" type="tel" class="form-input" placeholder="10-digit mobile number" maxlength="10" pattern="[0-9]{10}">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Place / Area</label>
        <input id="donPlace" type="text" class="form-input" placeholder="Village / Town / Area" autocomplete="off">
      </div>
    </div>

    <!-- Donation Amount -->
    <div class="form-section">
      <div class="form-section-title">💰 Donation Amount</div>
      <div class="amount-input-wrap">
        <span class="amount-prefix">₹</span>
        <input id="donAmount" type="number" class="form-input" placeholder="Enter amount" min="1" style="padding-left:32px;font-size:1.25rem;font-weight:800;">
      </div>
    </div>

    <!-- Payment Method -->
    <div class="form-section">
      <div class="form-section-title">💳 Payment Method</div>
      <div class="pay-method-row" id="payMethodRow">
        <button type="button" class="pay-method-btn active" onclick="setPayMethod('gpay', this)">
          <span class="pm-icon"><img src="gpay.png" alt="GPay" style="height:24px;vertical-align:middle;"></span><span>GPay</span>
        </button>
        <button type="button" class="pay-method-btn" onclick="setPayMethod('cash', this)">
          <span class="pm-icon">💵</span><span>Cash</span>
        </button>
      </div>
    </div>

    <!-- Interest Level -->
    <div class="form-section">
      <div class="form-section-title">⭐ Interest Level</div>
      <div class="interest-row" id="interestRow">
        <button type="button" class="interest-btn low" onclick="setInterest('low', this)">Low</button>
        <button type="button" class="interest-btn medium active" onclick="setInterest('medium', this)">Medium</button>
        <button type="button" class="interest-btn high" onclick="setInterest('high', this)">High</button>
      </div>
    </div>

    <!-- Notes -->
    <div class="form-section">
      <div class="form-section-title">📝 Notes (Optional)</div>
      <textarea id="donNotes" class="form-textarea" placeholder="Any additional notes about this donation..." style="min-height:80px;margin-bottom:0"></textarea>
    </div>

    <!-- Photo Upload Section -->
    <div class="form-section">
      <div class="form-section-title">📷 Receipt / Photo (Optional)</div>
      
      <div style="display:flex; gap:10px; margin-bottom:12px;">
         <button type="button" class="btn btn-primary" style="flex:1; font-size:0.875rem" onclick="document.getElementById('photoInputCam').click()">📷 Take Photo</button>
         <button type="button" class="btn btn-outline" style="flex:1; font-size:0.875rem" onclick="document.getElementById('photoInputGal').click()">🖼️ Gallery</button>
      </div>

      <div class="photo-grid" id="photoGrid"></div>
      <p class="form-hint" style="margin-top:8px">You can add up to 5 photos</p>
      <input type="file" id="photoInputCam" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="photoInputGal" accept="image/*" style="display:none" multiple>
    </div>

    <!-- Submit -->
    <button class="btn btn-primary btn-lg" onclick="submitDonation()" style="margin-bottom:24px">
      💝 Save Donation
    </button>

  </div>
</div>

<!-- SUCCESS SCREEN -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">💝</div>
  <h2 class="success-title">Donation Saved!</h2>
  <p class="success-msg" id="successMsg">The donation record has been saved successfully.</p>
  <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px">
    <a href="donation.html" class="btn btn-primary btn-lg">New Donation</a>
    <a href="index.html" class="btn btn-outline">← Home</a>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="js/i18n.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>

<script>
let selectedPayMethod = 'gpay';
let selectedInterest  = 'medium';
let photos = [];

let editId = null;
let voucherSettings = null;
let originalStaff = null;

document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const adminBypass = params.get('admin') === 'true';
  editId = params.get('editId');

  const user = getUser();
  if (!user && !adminBypass) { window.location.href = 'index.html'; return; }
  
  applyTranslations();
  renderPhotoGrid();
  
  // Voucher Logic
  if (user) {
    voucherSettings = await fbGetVoucherSettings(user.phone);
    if (voucherSettings && !editId) {
      if (voucherSettings.currentPage > voucherSettings.endPage) {
         document.querySelector('.btn-primary.btn-lg').disabled = true;
         document.querySelector('.btn-primary.btn-lg').textContent = '🚫 Voucher Book Exhausted';
         showToast('Voucher Book Exhausted. Please contact Admin.', 'error', 5000);
      } else {
         document.getElementById('donVoucher').value = voucherSettings.currentPage;
      }
    }
  }

  // Edit Mode Logic
  if (editId) {
    document.querySelector('.btn-primary.btn-lg').innerHTML = '💝 Update Donation';
    document.querySelector('.form-section-title').innerHTML = '🎫 Editing Voucher';
    showLoading('Loading donation data...');
    const doc = await fbGetDonationById(editId);
    hideLoading();
    if (doc) {
      originalStaff = { name: doc.staffName, phone: doc.staffPhone, createdAt: doc.createdAt };
      document.getElementById('donVoucher').value = doc.voucherId || '';
      document.getElementById('donName').value = doc.donorName || '';
      document.getElementById('donPhone').value = doc.donorPhone || '';
      document.getElementById('donPlace').value = doc.place || '';
      document.getElementById('donAmount').value = doc.amount || '';
      document.getElementById('donNotes').value = doc.notes || '';
      if (doc.donorName === 'Unknown' && doc.donorPhone === '0000000000') {
         document.getElementById('donUnknown').checked = true;
         toggleUnknownDonor();
      }
      if (doc.paymentMethod) setPayMethod(doc.paymentMethod, document.querySelector(`.pay-method-btn[onclick*="${doc.paymentMethod}"]`));
      if (doc.interestLevel) setInterest(doc.interestLevel, document.querySelector(`.interest-btn.${doc.interestLevel}`));
      if (doc.photos && doc.photos.length) {
         photos = [...doc.photos];
         renderPhotoGrid();
      }
    } else {
      showToast('Donation record not found', 'error');
    }
  }
});

function toggleUnknownDonor() {
  const isUnknown = document.getElementById('donUnknown').checked;
  const nameInput = document.getElementById('donName');
  const phoneInput = document.getElementById('donPhone');
  
  if (isUnknown) {
    nameInput.value = 'Unknown';
    nameInput.readOnly = true;
    phoneInput.value = '0000000000';
    phoneInput.readOnly = true;
  } else {
    nameInput.value = '';
    nameInput.readOnly = false;
    phoneInput.value = '';
    phoneInput.readOnly = false;
  }
}

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = '';
  photos.forEach((src, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    thumb.innerHTML = `
      <img src="${src}" alt="Photo ${i+1}" loading="lazy">
      <button class="photo-remove" onclick="removePhoto(${i})">✕</button>`;
    grid.appendChild(thumb);
  });
}

async function handlePhotoUpload(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  showLoading('Compressing...');
  for (const file of files) {
    if (photos.length >= 5) break;
    try {
      const compressed = await compressImage(file, 1200, 1200, 0.75);
      photos.push(compressed);
    } catch { showToast('Could not process photo', 'error'); }
  }
  hideLoading();
  renderPhotoGrid();
  e.target.value = '';
}

document.getElementById('photoInputCam').addEventListener('change', handlePhotoUpload);
document.getElementById('photoInputGal').addEventListener('change', handlePhotoUpload);

function removePhoto(idx) {
  photos.splice(idx, 1);
  renderPhotoGrid();
}

function setPayMethod(val, btn) {
  if(!btn) return;
  selectedPayMethod = val;
  document.querySelectorAll('#payMethodRow .pay-method-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setInterest(val, btn) {
  if(!btn) return;
  selectedInterest = val;
  document.querySelectorAll('#interestRow .interest-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function submitDonation() {
  const voucher= document.getElementById('donVoucher').value.trim().toUpperCase();
  const name   = document.getElementById('donName').value.trim();
  const phone  = document.getElementById('donPhone').value.trim();
  const place  = document.getElementById('donPlace').value.trim();
  const amount = parseFloat(document.getElementById('donAmount').value);
  const notes  = document.getElementById('donNotes').value.trim();

  if (!voucher){ showToast('Voucher ID is required', 'error'); return; }
  if (!name)  { showToast('Name is required', 'error'); return; }
  if (!/^\d{10}$/.test(phone)) { showToast('Enter a valid 10-digit phone number', 'error'); return; }
  if (!amount || amount <= 0)  { showToast('Enter a valid donation amount', 'error'); return; }

  showLoading('Saving donation...');
  const user = getUser() || { name: 'Admin Edit', phone: 'Admin' };

  let photoUrls = [];
  for (let i = 0; i < photos.length; i++) {
    try {
      if (photos[i].startsWith('http')) {
        photoUrls.push(photos[i]); // Keep existing
      } else {
        const url = await uploadPhoto(photos[i], `don_${Date.now()}_${i}.jpg`);
        photoUrls.push(url);
      }
    } catch { photoUrls.push(photos[i]); }
  }

  const sName = editId && originalStaff ? originalStaff.name : user.name;
  const sPhone = editId && originalStaff ? originalStaff.phone : user.phone;

  const record = {
    type:          'donation',
    voucherId:     voucher,
    staffName:     sName,
    staffPhone:    sPhone,
    donorName:     name,
    donorPhone:    phone,
    place:         place,
    paymentMethod: selectedPayMethod,
    interestLevel: selectedInterest,
    amount:        amount,
    notes:         notes,
    photos:        photoUrls,
  };
  
  if (!editId) {
    record.submittedAt = new Date().toISOString();
    record.dateStr = new Date().toISOString().split('T')[0];
  }

  try { 
    if (editId) {
       await db.collection("donations").doc(editId).update(record);
    } else {
       await fbSaveDonation(record); 
       // Increment voucher if we used the assigned one
       if (voucherSettings && parseInt(voucher) == voucherSettings.currentPage) {
         await fbIncrementVoucher(user.phone);
       }
    }
  } catch(e) { console.warn(e); }

  if (!editId && user.phone !== 'Admin') {
    // Save locally
    const local = JSON.parse(localStorage.getItem('trust_donations') || '[]');
    local.unshift({ ...record, id: 'local_' + Date.now() });
    localStorage.setItem('trust_donations', JSON.stringify(local.slice(0, 500)));
  }

  hideLoading();
  document.getElementById('successMsg').textContent = `₹${amount} donation from ${name} has been saved!`;
  document.getElementById('formWrap').style.display = 'none';
  
  if (editId && new URLSearchParams(window.location.search).get('admin') === 'true') {
     document.getElementById('successScreen').innerHTML = `
       <div class="success-icon">✅</div>
       <h2 class="success-title">Updated Successfully!</h2>
       <p class="success-msg" style="margin-bottom:20px">The donation record has been updated. You may close this tab.</p>
       <button class="btn btn-primary btn-lg" onclick="window.close()" style="width:100%;max-width:320px;margin:0 auto">Close Window</button>
     `;
  }
  
  document.getElementById('successScreen').classList.add('show');
}
</script>
</body>
</html>
